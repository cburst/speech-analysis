<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Speech Analysis</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
  background:#f4f6f8;
  margin:0;
  padding:60px 20px;
}

.container{
  max-width:760px;
  margin:auto;
}

.card{
  background:white;
  padding:36px;
  border-radius:10px;
  border:1px solid #e5e7eb;
}

h2{
  margin-top:0;
  margin-bottom:30px;
}

label{
  font-weight:600;
}

input, textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:20px;
  border:1px solid #d1d5db;
  border-radius:6px;
  font-size:14px;
}

textarea{
  height:130px;
  resize:vertical;
}

.audio-options{
  display:flex;
  align-items:flex-start;
}

.option{
  flex:1;
}

.option.left{
  padding-right:24px;
}

.option.right{
  padding-left:24px;
}

.divider{
  width:1px;
  background:#e5e7eb;
  height:52px;
  margin-top:30px;
}

.upload-box{
  border:1px solid #d1d5db;
  border-radius:6px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  height:44px;
  margin-top:10px;
}

.upload-box input{
  border:none;
  padding:0;
  margin:0;
  font-size:14px;
}

.button-row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

:root{
  --control-height:53px;
}

.upload-box{
  border:1px solid #d1d5db;
  border-radius:6px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  height:var(--control-height);
  margin-top:10px;
}

button{
  height:var(--control-height);
  padding:0 18px;
  border:none;
  border-radius:6px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-size:14px;
  line-height:1.2;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

button:disabled{
  background:#93c5fd;
  cursor:default;
}

.submit{
  margin-top:28px;
  width:100%;
  background:#16a34a;
  font-size:16px;
  height:55px;
}

.submit:hover{
  background:#15803d;
}

audio{
  margin-top:12px;
  width:100%;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Speech Analysis</h2>

<form id="form">

<label>Email *</label>
<input name="email" type="email" required>

<label>Name *</label>
<input name="name" required>

<label>Student Number *</label>
<input name="student" required>

<label>Document Text (exact words you will say) *</label>
<textarea name="text" required></textarea>

<div class="audio-options">

<div class="option left">

<label>Upload Audio</label>

<div class="upload-box">
<input type="file" id="fileInput" accept="audio/*">
</div>

</div>

<div class="divider"></div>

<div class="option right">

<label>Record Audio</label>

<div class="button-row">

<button type="button" id="record">
Start recording audio
</button>

<button type="button" id="stop" disabled>
Stop recording audio
</button>

<button type="button" id="preview" disabled>
Preview recorded audio
</button>

</div>

<audio id="player" controls style="display:none;"></audio>

</div>

</div>

<button class="submit" type="submit">
Submit
</button>

</form>

</div>
</div>

<script>

let recorder
let audioBlob

const recordBtn = document.getElementById("record")
const stopBtn = document.getElementById("stop")
const previewBtn = document.getElementById("preview")
const player = document.getElementById("player")

recordBtn.onclick = async () => {

  const stream = await navigator.mediaDevices.getUserMedia({audio:true})

  recorder = new MediaRecorder(stream)

  const chunks = []

  recorder.ondataavailable = e => chunks.push(e.data)

  recorder.onstop = () => {

    audioBlob = new Blob(chunks,{type:"audio/webm"})
    player.src = URL.createObjectURL(audioBlob)

    previewBtn.disabled = false
  }

  recorder.start()

  recordBtn.disabled = true
  stopBtn.disabled = false
}

stopBtn.onclick = () => {

  recorder.stop()

  recordBtn.disabled = false
  stopBtn.disabled = true
}

previewBtn.onclick = () => {

  player.style.display = "block"
  player.play()

}

const form = document.getElementById("form")

form.addEventListener("submit", async (e) => {

	e.preventDefault()

	const data = new FormData(form)

	const uploaded = document.getElementById("fileInput").files[0]

	if (uploaded) {
		data.append("audio", uploaded)
	}
	else if (audioBlob) {
		data.append("audio", audioBlob, "recording.webm")
	}
	else {
		alert("Please upload or record audio")
		return
	}

	const res = await fetch("upload", {
		method: "POST",
		body: data
	})

	if (res.ok) {

		alert("Uploaded successfully")

		form.reset()

		player.style.display = "none"
		previewBtn.disabled = true
		stopBtn.disabled = true

	}
	else {

		const msg = await res.text()

		alert("Upload failed (" + res.status + "): " + msg)

	}

})

</script>

</body>
</html>
